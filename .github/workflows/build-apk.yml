
name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq *.zip -d w
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - run: gradle -p "$(dirname "$(find w -maxdepth 3 -name settings.gradle.kts | head -1)")" :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: w/**/app/build/outputs/apk/debug/*.apk
